# Phase 8 hardening switches (yours: torus install leaves this file alone)
# Turn Claude off every time the phone reboots. Opt back in with: torus llm on
llm_off_at_boot=true
# Delete rotated log files older than this many days at boot (0 = never)
prune_logs_days=7
# Operator uploads (~/.torus/uploads/<task>) are deleted this many days after the task last changed (0 = never)
uploads_keep_days=7
