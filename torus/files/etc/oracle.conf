# oracled schedule (yours: torus install leaves this file alone)
# Refill every pinned topic this often (minutes, 5-1440). torus oracle every 120
every_minutes=60
# Set false to pause the schedule; torus oracle run still works. torus oracle off
enabled=true
# true = ignore fetcherd's 24 h page cache so each refill really re-reads the page
fresh=true
# Wait this long after oracled starts (boot) before the first refill
start_delay_seconds=90
